<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>KHÁNH LY — 3AM</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#05060b;
  --cyan:#7ef9ff;
  --purple:#a67dff;
  --pink:#ff8ecf;
  --text:#f4f6ff;
  --muted:#9aa2c9;
  --glass:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.09);
  --safeTop:env(safe-area-inset-top);
  --safeBottom:env(safe-area-inset-bottom);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05060b;
  color:white;
  font-family:Inter,sans-serif;
}

body{
  cursor:none;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

#stars{z-index:0;}
#particles{z-index:1;}
#rain{z-index:2;opacity:.4;}

.cursor{
  position:fixed;
  width:20px;
  height:20px;
  border-radius:50%;
  pointer-events:none;
  z-index:999;
  background:
  radial-gradient(circle,
  rgba(255,255,255,.95) 0%,
  rgba(126,249,255,.7) 20%,
  rgba(126,249,255,.1) 70%,
  transparent 100%);
  transform:translate(-50%,-50%);
  mix-blend-mode:screen;
}

.cursor-ring{
  position:fixed;
  width:70px;
  height:70px;
  border:1px solid rgba(126,249,255,.2);
  border-radius:50%;
  pointer-events:none;
  z-index:998;
  transform:translate(-50%,-50%);
}

.scanline{
  position:fixed;
  inset:0;
  z-index:50;
  pointer-events:none;
  opacity:.06;
  background:
  repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,.08),
    rgba(255,255,255,.08) 1px,
    transparent 1px,
    transparent 4px
  );
}

.noise{
  position:fixed;
  inset:0;
  z-index:51;
  opacity:.03;
  pointer-events:none;
  background-image:
  radial-gradient(circle, white 1px, transparent 1px);
  background-size:4px 4px;
}

.fog{
  position:fixed;
  inset:-20%;
  z-index:3;
  pointer-events:none;
  background:
  radial-gradient(circle at 20% 20%, rgba(166,125,255,.15), transparent 30%),
  radial-gradient(circle at 70% 50%, rgba(126,249,255,.08), transparent 35%),
  radial-gradient(circle at 40% 80%, rgba(255,142,207,.08), transparent 35%);
  filter:blur(90px);
  animation:fogMove 20s linear infinite alternate;
}

@keyframes fogMove{
  from{
    transform:translate(-3%,0) scale(1);
  }
  to{
    transform:translate(3%,-2%) scale(1.1);
  }
}

.loading{
  position:fixed;
  inset:0;
  z-index:9999;
  background:
  radial-gradient(circle at top,#11152c,#05060b 60%);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:24px;
  transition:opacity 1.8s ease,visibility 1.8s;
}

.loading.hide{
  opacity:0;
  visibility:hidden;
}

.loading-text{
  letter-spacing:3px;
  text-transform:uppercase;
  color:rgba(255,255,255,.75);
  font-size:clamp(.8rem,2vw,1rem);
}

.loading-bar{
  width:min(260px,70vw);
  height:1px;
  background:rgba(255,255,255,.08);
  overflow:hidden;
  position:relative;
}

.loading-bar::before{
  content:'';
  position:absolute;
  width:35%;
  inset:0;
  background:
  linear-gradient(90deg,
  transparent,
  var(--cyan),
  transparent);
  animation:loading 2s infinite;
}

@keyframes loading{
  from{
    transform:translateX(-150%);
  }
  to{
    transform:translateX(400%);
  }
}

.scene{
  position:absolute;
  inset:0;
  opacity:0;
  visibility:hidden;
  transform:scale(1.08);
  transition:
  opacity 1.5s cubic-bezier(.77,0,.18,1),
  transform 1.5s cubic-bezier(.77,0,.18,1),
  visibility 1.5s;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:
    calc(28px + var(--safeTop))
    24px
    calc(28px + var(--safeBottom));
}

.scene.active{
  opacity:1;
  visibility:visible;
  transform:scale(1);
}

.content{
  width:min(92vw,650px);
  position:relative;
  z-index:5;
}

.glass{
  position:relative;
  overflow:hidden;
  border-radius:28px;
  padding:32px 24px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  box-shadow:
  0 0 60px rgba(126,249,255,.05),
  0 10px 50px rgba(0,0,0,.4);
}

.glass::before{
  content:'';
  position:absolute;
  inset:0;
  background:
  linear-gradient(130deg,
  rgba(255,255,255,.12),
  transparent 30%);
}

.kicker{
  font-family:Orbitron,sans-serif;
  font-size:.7rem;
  letter-spacing:6px;
  color:var(--cyan);
  margin-bottom:16px;
  text-transform:uppercase;
}

h1{
  font-family:Orbitron,sans-serif;
  font-size:clamp(2.8rem,10vw,6rem);
  letter-spacing:6px;
  margin-bottom:18px;
  text-shadow:
  0 0 15px rgba(126,249,255,.35),
  0 0 40px rgba(166,125,255,.2);
}

.message{
  font-size:clamp(1.05rem,4vw,1.5rem);
  line-height:1.8;
  min-height:90px;
  color:rgba(255,255,255,.95);
}

.small{
  margin-top:20px;
  color:var(--muted);
  font-size:.8rem;
  letter-spacing:2px;
  text-transform:uppercase;
}

.room{
  position:absolute;
  inset:0;
  background:
  radial-gradient(circle at 50% 120%, rgba(126,249,255,.1), transparent 35%),
  linear-gradient(to top, rgba(7,9,20,.95), rgba(7,9,20,.3));
}

.window{
  position:absolute;
  right:-5%;
  top:8%;
  width:65%;
  height:70%;
  background:
  linear-gradient(to bottom,
  rgba(126,249,255,.03),
  rgba(166,125,255,.04));
  border:1px solid rgba(255,255,255,.08);
  transform:skew(-8deg);
  opacity:.5;
}

.aurora{
  position:absolute;
  inset:-10%;
  background:
  radial-gradient(circle at 30% 40%, rgba(166,125,255,.18), transparent 35%),
  radial-gradient(circle at 70% 30%, rgba(126,249,255,.15), transparent 35%),
  radial-gradient(circle at 50% 80%, rgba(255,142,207,.1), transparent 35%);
  filter:blur(90px);
  animation:aurora 10s ease-in-out infinite alternate;
}

@keyframes aurora{
  from{
    transform:translate(-2%,0) scale(1);
  }
  to{
    transform:translate(2%,-2%) scale(1.08);
  }
}

.controls{
  position:fixed;
  bottom:calc(18px + var(--safeBottom));
  left:50%;
  transform:translateX(-50%);
  z-index:300;
  display:flex;
  gap:12px;
}

.ctrl{
  width:48px;
  height:48px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.05);
  backdrop-filter:blur(12px);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  transition:.3s;
}

.ctrl:hover{
  transform:translateY(-2px);
  box-shadow:0 0 20px rgba(126,249,255,.2);
}

.progress{
  position:fixed;
  top:calc(22px + var(--safeTop));
  left:50%;
  transform:translateX(-50%);
  z-index:300;
  display:flex;
  gap:8px;
}

.dot{
  width:32px;
  height:3px;
  border-radius:999px;
  overflow:hidden;
  background:rgba(255,255,255,.08);
}

.dot::before{
  content:'';
  display:block;
  width:100%;
  height:100%;
  background:
  linear-gradient(90deg,var(--cyan),var(--purple));
  transform:translateX(-100%);
  transition:1s;
}

.dot.active::before{
  transform:translateX(0);
}

.holo{
  margin-top:24px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.holo-card{
  padding:16px;
  border-radius:18px;
  background:rgba(126,249,255,.04);
  border:1px solid rgba(126,249,255,.08);
  font-size:.82rem;
  color:rgba(255,255,255,.7);
  animation:float 5s ease-in-out infinite;
}

.holo-card:nth-child(2){animation-delay:-2s;}
.holo-card:nth-child(3){animation-delay:-1s;}
.holo-card:nth-child(4){animation-delay:-3s;}

@keyframes float{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-8px);
  }
}

.whisper{
  position:fixed;
  z-index:120;
  color:rgba(255,255,255,.12);
  font-size:.8rem;
  letter-spacing:2px;
  pointer-events:none;
  animation:whisper 5s linear forwards;
}

@keyframes whisper{
  0%{
    opacity:0;
    transform:translateY(10px);
  }
  20%{
    opacity:1;
  }
  100%{
    opacity:0;
    transform:translateY(-80px);
  }
}

.flash{
  position:fixed;
  inset:0;
  background:white;
  z-index:500;
  opacity:0;
  pointer-events:none;
}

.flash.active{
  animation:flash .8s ease;
}

@keyframes flash{
  0%{opacity:0;}
  20%{opacity:.15;}
  100%{opacity:0;}
}

@media(max-width:768px){

  .glass{
    padding:28px 20px;
    border-radius:24px;
  }

  .message{
    min-height:120px;
  }

}

</style>
</head>

<body>

<div class="cursor"></div>
<div class="cursor-ring"></div>

<canvas id="stars"></canvas>
<canvas id="particles"></canvas>
<canvas id="rain"></canvas>

<div class="fog"></div>
<div class="scanline"></div>
<div class="noise"></div>

<div class="flash"></div>

<!-- LOADING -->

<div class="loading" id="loading">
  <div class="loading-text" id="loadingText">
    Đang khởi tạo hồi phục cảm xúc...
  </div>

  <div class="loading-bar"></div>
</div>

<!-- PROGRESS -->

<div class="progress">
  <div class="dot active"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
</div>

<!-- SCENE 1 -->

<section class="scene active">

  <div class="room"></div>
  <div class="window"></div>

  <div class="content">
    <div class="glass">

      <div class="kicker">
        Kết nối thành công
      </div>

      <h1>KHÁNH LY</h1>

      <div class="message typing"
      data-text="Bạn vẫn còn thức à?"></div>

      <div class="small">
        Chạm • Vuốt • Phím mũi tên
      </div>

    </div>
  </div>

</section>

<!-- SCENE 2 -->

<section class="scene">

  <div class="room"></div>
  <div class="window"></div>

  <div class="content">
    <div class="glass">

      <div class="kicker">
        03:07 AM
      </div>

      <div class="message typing"
      data-text="Hôm nay lại khó khăn sao?"></div>

      <div class="holo">

        <div class="holo-card">
          Trạng thái cảm xúc: 42%
        </div>

        <div class="holo-card">
          Ký ức đang hoạt động
        </div>

        <div class="holo-card">
          Chế độ mơ đã mở
        </div>

        <div class="holo-card">
          AI vẫn ở cạnh bạn
        </div>

      </div>

    </div>
  </div>

</section>

<!-- SCENE 3 -->

<section class="scene">

  <div class="aurora"></div>

  <div class="content">
    <div class="glass">

      <div class="kicker">
        Phân tích ký ức
      </div>

      <div class="message typing"
      data-text="Bạn đã cố gắng nhiều hơn bạn nghĩ."></div>

    </div>
  </div>

</section>

<!-- SCENE 4 -->

<section class="scene">

  <div class="aurora"></div>

  <div class="content">
    <div class="glass">

      <div class="kicker">
        Không gian sâu
      </div>

      <div class="message typing"
      data-text="Không sao nếu bạn mệt."></div>

    </div>
  </div>

</section>

<!-- SCENE 5 -->

<section class="scene">

  <div class="aurora"></div>

  <div class="content">
    <div class="glass">

      <div class="kicker">
        Tín hiệu cuối
      </div>

      <div class="message typing"
      data-text="Bạn không cần phải mạnh mẽ mọi lúc."></div>

    </div>
  </div>

</section>

<!-- SCENE 6 -->

<section class="scene">

  <div class="content">
    <div class="glass">

      <div class="kicker">
        Chúc ngủ ngon
      </div>

      <div class="message typing"
      data-text="Khánh Ly à...
cảm ơn vì vẫn còn ở đây."></div>

    </div>
  </div>

</section>

<!-- CONTROLS -->

<div class="controls">

  <div class="ctrl" id="prev">
    ←
  </div>

  <div class="ctrl" id="next">
    →
  </div>

</div>

<script>

/* =========================
   LOADING
========================= */

const loadingMessages = [
  "Đang khởi tạo hồi phục cảm xúc...",
  "Đang tìm các mảnh ký ức...",
  "Kết nối thành công."
];

let loadIndex = 0;

const loadingText =
document.getElementById("loadingText");

const loadingInterval = setInterval(()=>{

  loadIndex++;

  if(loadIndex < loadingMessages.length){
    loadingText.textContent =
    loadingMessages[loadIndex];
  }

},1700);

setTimeout(()=>{

  clearInterval(loadingInterval);

  document.getElementById("loading")
  .classList.add("hide");

},5200);

/* =========================
   CURSOR
========================= */

const cursor =
document.querySelector(".cursor");

const ring =
document.querySelector(".cursor-ring");

window.addEventListener("mousemove",(e)=>{

  cursor.style.left = e.clientX+"px";
  cursor.style.top = e.clientY+"px";

  ring.style.left = e.clientX+"px";
  ring.style.top = e.clientY+"px";

});

/* =========================
   SCENE SYSTEM
========================= */

const scenes =
document.querySelectorAll(".scene");

const dots =
document.querySelectorAll(".dot");

let current = 0;
let locked = false;

function showScene(index){

  if(index < 0 ||
     index >= scenes.length ||
     locked) return;

  locked = true;

  document.querySelector(".flash")
  .classList.add("active");

  setTimeout(()=>{
    document.querySelector(".flash")
    .classList.remove("active");
  },800);

  scenes[current]
  .classList.remove("active");

  dots[current]
  .classList.remove("active");

  current = index;

  scenes[current]
  .classList.add("active");

  dots[current]
  .classList.add("active");

  typingEffect(scenes[current]);

  if(navigator.vibrate){
    navigator.vibrate(12);
  }

  setTimeout(()=>{
    locked = false;
  },1200);

}

/* =========================
   BUTTONS
========================= */

document.getElementById("next")
.onclick = ()=>{

  if(current < scenes.length-1){
    showScene(current+1);
  }

};

document.getElementById("prev")
.onclick = ()=>{

  if(current > 0){
    showScene(current-1);
  }

};

/* =========================
   KEYBOARD
========================= */

window.addEventListener("keydown",(e)=>{

  if(e.key === "ArrowRight"){
    showScene(current+1);
  }

  if(e.key === "ArrowLeft"){
    showScene(current-1);
  }

});

/* =========================
   SWIPE MOBILE
========================= */

let startX = 0;

window.addEventListener("touchstart",(e)=>{

  startX = e.touches[0].clientX;

},{passive:true});

window.addEventListener("touchend",(e)=>{

  let endX = e.changedTouches[0].clientX;

  let diff = startX - endX;

  if(diff > 50){
    showScene(current+1);
  }

  if(diff < -50){
    showScene(current-1);
  }

},{passive:true});

/* =========================
   CLICK NEXT
========================= */

window.addEventListener("click",(e)=>{

  if(e.target.classList.contains("ctrl"))
  return;

  if(current < scenes.length-1){
    showScene(current+1);
  }

});

/* =========================
   TYPING EFFECT
========================= */

function typingEffect(scene){

  const el =
  scene.querySelector(".typing");

  if(!el) return;

  const text = el.dataset.text;

  el.textContent = "";

  let i = 0;

  const typing = setInterval(()=>{

    el.textContent += text.charAt(i);

    i++;

    if(i >= text.length){
      clearInterval(typing);
    }

  },42);

}

typingEffect(scenes[0]);

/* =========================
   CANVAS SETUP
========================= */

function setupCanvas(id){

  const canvas =
  document.getElementById(id);

  const ctx =
  canvas.getContext("2d");

  function resize(){

    canvas.width =
    innerWidth * devicePixelRatio;

    canvas.height =
    innerHeight * devicePixelRatio;

    ctx.scale(devicePixelRatio,
    devicePixelRatio);

  }

  resize();

  addEventListener("resize",resize);

  return {canvas,ctx};

}

/* =========================
   STARS
========================= */

const starsCanvas =
setupCanvas("stars");

const starCtx =
starsCanvas.ctx;

const stars = [];

const starCount =
innerWidth < 768 ? 60 : 140;

for(let i=0;i<starCount;i++){

  stars.push({
    x:Math.random()*innerWidth,
    y:Math.random()*innerHeight,
    r:Math.random()*1.5,
    o:Math.random(),
    s:Math.random()*0.3
  });

}

function drawStars(){

  starCtx.clearRect(
    0,0,innerWidth,innerHeight
  );

  stars.forEach(star=>{

    star.y += star.s;

    if(star.y > innerHeight){
      star.y = -5;
    }

    starCtx.beginPath();

    starCtx.arc(
      star.x,
      star.y,
      star.r,
      0,
      Math.PI*2
    );

    starCtx.fillStyle =
    "rgba(255,255,255,"+star.o+")";

    starCtx.fill();

  });

}

/* =========================
   PARTICLES
========================= */

const particleCanvas =
setupCanvas("particles");

const pctx =
particleCanvas.ctx;

const particles = [];

const particleCount =
innerWidth < 768 ? 40 : 90;

for(let i=0;i<particleCount;i++){

  particles.push({

    x:Math.random()*innerWidth,
    y:Math.random()*innerHeight,
    r:Math.random()*3+1,

    vx:(Math.random()-.5)*0.2,
    vy:(Math.random()-.5)*0.2,

    glow:Math.random()*20+10

  });

}

function drawParticles(){

  pctx.clearRect(
    0,0,innerWidth,innerHeight
  );

  particles.forEach(p=>{

    p.x += p.vx;
    p.y += p.vy;

    if(p.x < 0) p.x = innerWidth;
    if(p.x > innerWidth) p.x = 0;

    if(p.y < 0) p.y = innerHeight;
    if(p.y > innerHeight) p.y = 0;

    let gradient =
    pctx.createRadialGradient(
      p.x,p.y,0,
      p.x,p.y,p.glow
    );

    gradient.addColorStop(
      0,
      "rgba(126,249,255,.2)"
    );

    gradient.addColorStop(
      1,
      "transparent"
    );

    pctx.fillStyle = gradient;

    pctx.beginPath();

    pctx.arc(
      p.x,p.y,p.glow,
      0,Math.PI*2
    );

    pctx.fill();

  });

}

/* =========================
   RAIN
========================= */

const rainCanvas =
setupCanvas("rain");

const rctx =
rainCanvas.ctx;

const rainDrops = [];

const rainCount =
innerWidth < 768 ? 90 : 180;

for(let i=0;i<rainCount;i++){

  rainDrops.push({

    x:Math.random()*innerWidth,
    y:Math.random()*innerHeight,

    l:Math.random()*20+10,
    s:Math.random()*4+4

  });

}

function drawRain(){

  rctx.clearRect(
    0,0,innerWidth,innerHeight
  );

  rainDrops.forEach(r=>{

    r.y += r.s;

    if(r.y > innerHeight){

      r.y = -20;
      r.x = Math.random()*innerWidth;

    }

    rctx.beginPath();

    rctx.moveTo(r.x,r.y);
    rctx.lineTo(r.x-2,r.y+r.l);

    rctx.strokeStyle =
    "rgba(180,220,255,.18)";

    rctx.lineWidth = 1;

    rctx.stroke();

  });

}

/* =========================
   SHOOTING STAR
========================= */

function shootingStar(){

  const star =
  document.createElement("div");

  star.style.position = "fixed";
  star.style.left =
  Math.random()*window.innerWidth+"px";

  star.style.top = "-10px";

  star.style.width = "2px";
  star.style.height = "120px";

  star.style.pointerEvents = "none";

  star.style.zIndex = "80";

  star.style.background =
  "linear-gradient(to bottom, rgba(255,255,255,.8), transparent)";

  star.style.transform =
  "rotate(35deg)";

  document.body.appendChild(star);

  let y = -100;
  let x = parseFloat(star.style.left);

  function animate(){

    y += 12;
    x -= 4;

    star.style.top = y+"px";
    star.style.left = x+"px";

    if(y < innerHeight+100){

      requestAnimationFrame(animate);

    }else{

      star.remove();

    }

  }

  animate();

}

setInterval(shootingStar,7000);

/* =========================
   WHISPERS
========================= */

const whispers = [

  "mọi thứ rồi sẽ ổn",
  "ngủ một chút nhé",
  "hít thở chậm thôi",
  "bạn đã rất cố gắng",
  "đêm nay yên tĩnh quá"

];

function createWhisper(){

  const w =
  document.createElement("div");

  w.className = "whisper";

  w.innerText =
  whispers[
    Math.floor(Math.random()*whispers.length)
  ];

  w.style.left =
  Math.random()*window.innerWidth+"px";

  w.style.top =
  Math.random()*window.innerHeight+"px";

  document.body.appendChild(w);

  setTimeout(()=>{
    w.remove();
  },5000);

}

setInterval(createWhisper,4000);

/* =========================
   PARALLAX
========================= */

window.addEventListener("mousemove",(e)=>{

  const x =
  (e.clientX / innerWidth - .5) * 10;

  const y =
  (e.clientY / innerHeight - .5) * 10;

  document
  .querySelectorAll(".glass")
  .forEach(g=>{

    g.style.transform =
    `translate(${x*.4}px,${y*.4}px)`;

  });

});

/* =========================
   RANDOM FLICKER
========================= */

setInterval(()=>{

  document.body.style.filter =
  "brightness(1.04)";

  setTimeout(()=>{
    document.body.style.filter =
    "brightness(1)";
  },80);

},6000);

/* =========================
   LOOP
========================= */

function animate(){

  drawStars();
  drawParticles();
  drawRain();

  requestAnimationFrame(animate);

}

animate();

</script>

</body>
</html>
